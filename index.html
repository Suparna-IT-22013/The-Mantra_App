<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantra App</title>
    <link rel="stylesheet" href="style.css">
</head><body>
<div class="container">
<h1 class="title">🕉️ Mantra_App</h1>
 <div class="mantra">
        হরে কৃষ্ণ হরে কৃষ্ণ<br>
        কৃষ্ণ কৃষ্ণ হরে হরে<br>
        হরে রাম হরে রাম<br>
        রাম রাম হরে হরে
    </div><div class="count-display">
        <span id="currentCount" class="big">0</span>
        <div class="label">Current Count</div>
        <div id="progressText" class="small">0 / 108</div>
    </div>
    <div class="stats">
        <div class="box">
            <div id="malaCount" class="big">0</div>
            <div class="label">Full Mala</div>
        </div>
  <div class="box">
            <div id="goalCount" class="big">0</div>
            <div class="label">Spiritual Goals</div>
        </div></div><div class="buttons">
        <button id="countBtn" class="btn count">Count</button>
        <button id="resetBtn" class="btn reset">Reset</button>
    </div> <div class="footer">
        © Developed by SuparnaPauL
    </div></div>
    <script src="script.js"></script>
</body>
</html>
