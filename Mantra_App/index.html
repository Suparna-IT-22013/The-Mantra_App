<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantra App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>🕉️ Mantra_App</h1> </div>
       <div class="decorative-section">
            <div class="mantra-text">
                <span class="mantra-line">হরে কৃষ্ণ হরে কৃষ্ণ</span><br />
                <span class="mantra-line">কৃষ্ণ কৃষ্ণ হরে হরে</span><br />
                <span class="mantra-line">হরে রাম হরে রাম</span><br />
                <span class="mantra-line">রাম রাম হরে হরে</span> </div>
            <div class="symbol-image-container">
                <span class="om-emoji">🕉️</span></div>  </div>
       <div class="counter-display">
            <div class="current-count">
                <span class="count-number" id="currentCount">0</span>
                 </div>
           <div class="mala-display">
                <span class="mala-number" id="malaCount">0</span>
                <span class="mala-label">Completed Mala(s)</span>
            </div> </div>
        <div class="counter-buttons">
            <button id="countBtn">Count</button>
            <button id="resetBtn">Reset</button>
        </div>  </div></body></html>
